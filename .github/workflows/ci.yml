name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: teknikalid_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/teknikalid_ci
      AUTH_SECRET: ci-only-secret-not-prod-000000000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema validate + generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Materialize schema on CI database (diff, migration-history agnostic)
        run: |
          npx prisma migrate diff \
            --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/schema.sql
          docker exec -i ${{ job.services.postgres.id }} true 2>/dev/null || true
          PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d teknikalid_ci < /tmp/schema.sql

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint --if-present

      - name: Test suite
        run: npm test --if-present

      - name: Build (production)
        run: npm run build
